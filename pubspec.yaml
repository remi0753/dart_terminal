name: dart_terminal
description: An independent Dart-first macOS terminal emulator built on dart_appkit.
publish_to: none

environment:
  sdk: '>=3.13.2 <3.14.0'

dependencies:
  dart_appkit:
    path: ../dart_appkit/packages/dart_appkit
  dart_macos_runtime:
    path: ../dart_appkit/packages/dart_macos_runtime
  dart_pty_macos:
    path: packages/dart_pty_macos
  dart_terminal_applescript_macos:
    path: packages/dart_terminal_applescript_macos
  dart_terminal_app_intents_macos:
    path: packages/dart_terminal_app_intents_macos
  dart_terminal_renderer_macos:
    path: packages/dart_terminal_renderer_macos
