name: dart_terminal_renderer_macos
description: A native macOS terminal renderer capability for dart_appkit.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: '>=3.13.2 <3.14.0'

dependencies:
  code_assets: any
  dart_appkit:
    path: ../../../dart_appkit/packages/dart_appkit
  dart_macos_runtime:
    path: ../../../dart_appkit/packages/dart_macos_runtime
  ffi: any
  hooks: any
  native_toolchain_c: any
